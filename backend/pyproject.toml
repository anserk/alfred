[project]
name = "alfred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "argparse>=1.4.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi[all,standard]>=0.135.1",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.48",
    "sumy>=0.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["tools", "services", "routers", "repositories"]
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false