services:

  nginx:
    image: nginx:alpine
    container_name: alfred-nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - homelab
      - default

  frontend:
    build: ./frontend
    container_name: alfred-frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run dev -- --host"
    networks:
      - default

  backend:
    build: ./backend
    container_name: alfred-backend 
    env_file: .env
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  postgres:
    image: postgres:16
    container_name: alfred-postgres 
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - default

volumes:
  postgres_data:

networks:
  homelab:
    external: true